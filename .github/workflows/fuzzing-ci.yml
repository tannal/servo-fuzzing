name: Servo Fuzzing CI

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Unit Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout servo/fuzzing
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install servo-fuzzing
        run: |
          pip install -e . pytest

      - name: Run unit tests
        run: |
          python -m pytest -q tests

      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -shellcheck=

      - name: Validate JSON files
        run: |
          for f in configs/*.json signatures/*.json; do
            python -m json.tool "$f" > /dev/null
          done
          servo-fuzzing validate-signatures --signatures signatures/rust-panic.json
          servo-fuzzing validate-signatures --signatures signatures/fixed-history.json

      - name: Sync B-fuzzing issues from servo/servo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          servo-fuzzing sync-issues \
            --signatures signatures/rust-panic.json \
            --history signatures/fixed-history.json \
            --repo servo/servo

      - name: Validate synchronized signatures
        run: |
          servo-fuzzing validate-signatures --signatures signatures/rust-panic.json
          servo-fuzzing validate-signatures --signatures signatures/fixed-history.json

  # Generated testcases are random, so new upstream panics would fail unrelated PRs.
  fuzzing:
    name: Headless DOM Fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout servo/fuzzing
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install servo-fuzzing
        run: |
          pip install -e .

      - name: Cache DOM Generators
        uses: actions/cache@v6
        with:
          path: generators/
          key: fuzzing-generators-${{ runner.os }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            fuzzing-generators-${{ runner.os }}-

      - name: Install Servoshell Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-gl \
            libxkbcommon0

      - name: Download latest Servoshell nightly (if not built in-tree)
        run: |
          ./download-latest-nightly.sh

      - name: Validate signature database
        run: |
          servo-fuzzing validate-signatures --signatures signatures/rust-panic.json

      - name: Run Fuzzing Suite
        id: run-fuzzing
        run: |
          servo-fuzzing run \
            --binary ./servo/servoshell \
            --config configs/ci.json \
            --signatures signatures/rust-panic.json \
            --output target/fuzzing

      - name: Collect New Panic Corpus
        if: always()
        run: |
          if [ -f target/fuzzing/summary.json ]; then
            python -m servo_fuzzing.collect --input target/fuzzing --output target/panic-corpus
          fi

      - name: Package New Panic Corpus
        if: always()
        run: |
          if [ -d target/panic-corpus ] && find target/panic-corpus -name '*.html' -print -quit | grep -q .; then
            tar -czf target/new-panic-corpus.tar.gz -C target/panic-corpus .
          fi

      - name: Upload New Panic Corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: new-panic-corpus
          path: target/new-panic-corpus.tar.gz
          if-no-files-found: ignore

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f target/fuzzing/report.md ]; then
            cat target/fuzzing/report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzzing-artifacts
          path: target/fuzzing/
