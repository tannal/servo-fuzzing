name: Servo Fuzzing CI

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Unit Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout servo/fuzzing
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install servo-fuzzing
        run: |
          pip install -e . pytest

      - name: Run unit tests
        run: |
          python -m pytest -q tests

      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -shellcheck=

      - name: Validate JSON files
        run: |
          for f in configs/*.json signatures/*.json; do
            python -m json.tool "$f" > /dev/null
          done
          servo-fuzzing validate-signatures --signatures signatures/rust-panic.json
          servo-fuzzing validate-signatures --signatures signatures/fixed-history.json

  bundle-replay:
    name: Replay 1200-Testcase Bundle
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout servo-fuzzing
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install servo-fuzzing
        run: pip install -e .

      - name: Install Servoshell Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-gl \
            libxkbcommon0

      - name: Download latest Servoshell nightly
        run: ./download-latest-nightly.sh

      - name: Replay Bundle (Stdlib Runner Contract)
        env:
          BUNDLE_VERSION: ${{ vars.BUNDLE_VERSION || 'latest' }}
          REPLAY_TIMEOUTS: ${{ vars.REPLAY_TIMEOUTS || 'exclude' }}
        run: |
          python -m servo_fuzzing.runner \
            --binary ./servo/servoshell \
            --bundle "$BUNDLE_VERSION" \
            --signatures signatures/rust-panic.json \
            --timeouts "$REPLAY_TIMEOUTS" \
            --jobs 4 \
            --timeout 2.0 \
            --output target/fuzzing

      - name: Publish Replay Summary
        if: always()
        run: |
          if [ -f target/fuzzing/report.md ]; then
            cat target/fuzzing/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Replay Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-replay-artifacts
          path: target/fuzzing/

  # Generated testcases are random, so scheduled discovery runs separately from PR gating.
  fuzzing:
    name: Headless DOM Fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      proposals: ${{ steps.propose.outputs.found }}
    steps:
      - name: Checkout servo/fuzzing
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install servo-fuzzing
        run: |
          pip install -e .[generators]

      - name: Cache DOM Generators
        uses: actions/cache@v6
        with:
          path: generators/
          key: fuzzing-generators-${{ runner.os }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            fuzzing-generators-${{ runner.os }}-

      - name: Install Servoshell Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-gl \
            libxkbcommon0

      - name: Download latest Servoshell nightly (if not built in-tree)
        run: |
          ./download-latest-nightly.sh

      - name: Validate signature database
        run: |
          servo-fuzzing validate-signatures --signatures signatures/rust-panic.json

      - name: Run Fuzzing Suite
        id: run-fuzzing
        run: |
          servo-fuzzing run \
            --binary ./servo/servoshell \
            --config configs/ci.json \
            --signatures signatures/rust-panic.json \
            --output target/fuzzing || true

      - name: Deduplicate and Minimize New Panics
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d target/fuzzing/new_crashes ]; then
            servo-fuzzing sync-drafts \
              --triage-dir target/fuzzing \
              --signatures signatures/rust-panic.json \
              --drafts target/fuzzing/draft-signatures.json \
              --corpus target/panic-corpus \
              --reduce-binary ./servo/servoshell \
              --reduce-timeout 2.0 \
              --lookup-github
          fi

      - name: Draft Evidence Packs & Proposals for New Panics
        id: propose
        if: always() && hashFiles('target/fuzzing/draft-signatures.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.UPSTREAM_ISSUE_REPO || github.repository }}
        run: |
          servo-fuzzing propose \
            --drafts target/fuzzing/draft-signatures.json \
            --corpus target/panic-corpus \
            --binary ./servo/servoshell \
            --output target/proposals \
            --repo "$TARGET_REPO" \
            --bisect
          if [ -f "target/proposals/proposals.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Panic Proposals
        if: always() && steps.propose.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: panic-proposals
          path: target/proposals

      - name: Package New Panic Corpus
        if: always()
        run: |
          if [ -d target/panic-corpus ] && find target/panic-corpus -name '*.html' -print -quit | grep -q .; then
            tar -czf target/new-panic-corpus.tar.gz -C target/panic-corpus .
          fi

      - name: Upload New Panic Corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: new-panic-corpus
          path: target/new-panic-corpus.tar.gz
          if-no-files-found: ignore

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f target/fuzzing/report.md ]; then
            cat target/fuzzing/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzzing-artifacts
          path: target/fuzzing/

  report-new-panics:
    name: File Upstream Issues & Update Signatures
    needs: fuzzing
    if: ${{ !cancelled() && needs.fuzzing.outputs.proposals == 'true' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/report-new-panics.yml
    with:
      artifact: panic-proposals
    secrets: inherit
