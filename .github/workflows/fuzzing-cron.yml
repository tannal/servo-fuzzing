name: Fuzzing Campaign & Maintenance (Cron)

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  campaign:
    name: Generate, Triage & Publish Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install servo-fuzzing
        run: pip install -e .[generators]

      - name: Install Servoshell Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-gl \
            libxkbcommon0

      - name: Download latest Servoshell
        run: ./download-latest-nightly.sh

      - name: Prune Fixed/Closed Issues from Upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          servo-fuzzing prune-closed \
            --signatures signatures/rust-panic.json \
            --archive signatures/fixed-history.json

      - name: Setup DOM Generators
        run: servo-fuzzing setup-generators

      - name: Run Discovery & Exploration (Generate fresh test cases)
        run: servo-fuzzing generate -n 100 -o target/generated

      - name: Triage Generated Testcases & Auto-Reduce Panics
        run: |
          servo-fuzzing run \
            --binary ./servo/servoshell \
            --signatures signatures/rust-panic.json \
            --testcases target/generated \
            --output target/triage \
            --timeout 2.0 || true

          if [ -d "target/triage/new_crashes" ]; then
            declare -A seen_sigs
            for crash_dir in target/triage/new_crashes/*; do
              if [ -d "$crash_dir" ]; then
                crash_id=$(basename "$crash_dir")
                sig_file="$crash_dir/signature_draft.json"
                sig_id=""
                if [ -f "$sig_file" ]; then
                  sig_id=$(grep -o '"id": "[^"]*' "$sig_file" | head -n 1 | cut -d'"' -f4)
                fi
                if [ -n "$sig_id" ] && [ -n "${seen_sigs[$sig_id]}" ]; then
                  continue
                fi
                [ -n "$sig_id" ] && seen_sigs[$sig_id]=1

                repro_file=$(find "$crash_dir" -name "*.html" | head -n 1)
                sig_arg=""
                if [ -f "$sig_file" ]; then
                  sig_arg="--signature $sig_file"
                fi
                out_name="crash-${sig_id:-$crash_id}.html"
                if [ -n "$repro_file" ]; then
                  servo-fuzzing reduce "$repro_file" \
                    --binary ./servo/servoshell \
                    --output "testcases/corpus/${out_name}" \
                    $sig_arg \
                    --timeout 2.0 || cp "$repro_file" "testcases/corpus/${out_name}"
                fi
              fi
            done
          fi

      - name: Preserve New Panic Corpus
        id: collect-corpus
        if: always()
        run: |
          if [ -f target/triage/summary.json ]; then
            python -m servo_fuzzing.collect --input target/triage --output testcases/corpus
          fi

      - name: Package New Panic Corpus
        if: always()
        run: |
          SRC_DIR=""
          if [ -d target/triage/corpus ] && find target/triage/corpus -name '*.html' -print -quit | grep -q .; then
            SRC_DIR="target/triage/corpus"
          elif [ -d testcases/corpus ] && find testcases/corpus -name '*.html' -print -quit | grep -q .; then
            SRC_DIR="testcases/corpus"
          fi
          if [ -n "$SRC_DIR" ]; then
            tar -czf target/new-panic-corpus.tar.gz -C "$SRC_DIR" .
            echo "Packaged new panic corpus from $SRC_DIR into target/new-panic-corpus.tar.gz"
          fi

      - name: Upload New Panic Corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-panic-corpus
          path: target/new-panic-corpus.tar.gz
          if-no-files-found: ignore

      - name: Pack Clean Active Bundle (Excluding timeout hangs)
        run: |
          servo-fuzzing bundle pack \
            --source target/generated \
            --output target/fuzz-bundle-latest.tar.gz \
            --from-triage target/triage \
            --binary ./servo/servoshell \
            --jobs 4 \
            --timeout 2.0 \
            --max-tests 300

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-bundle-latest
          path: target/fuzz-bundle-latest.tar.gz

      - name: Publish Latest Bundle & Panic Corpus to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS="target/fuzz-bundle-latest.tar.gz"
          if [ -f target/new-panic-corpus.tar.gz ]; then
            ASSETS="$ASSETS target/new-panic-corpus.tar.gz"
          fi
          gh release upload latest $ASSETS --clobber || \
          gh release create latest $ASSETS \
            --title "Latest Fuzzing Bundle & Panic Corpus" \
            --notes "Automated clean fuzzing bundle for PR CI and latest panic reproducers corpus."

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f "target/triage/report.md" ]; then
            cat target/triage/report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Triage Reports & Reproductions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-reports
          path: target/triage

      - name: Open Corpus Review Pull Request
        id: cpr
        if: ${{ !cancelled() && steps.collect-corpus.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v6
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          draft: true
          add-paths: |
            testcases/corpus/
            signatures/rust-panic.json
            signatures/fixed-history.json
          commit-message: "chore(fuzzing): automated weekly maintenance and corpus update"
          title: "chore: review fuzzing corpus from run ${{ github.run_id }}"
          body: |
            Automated maintenance run:
            - Pruned closed/fixed issues from `rust-panic.json` to `fixed-history.json`
            - Minimized newly discovered panics into `testcases/corpus/`
            - Refreshed clean active testcase bundle

            Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: "automated/panic-corpus-${{ github.run_id }}"
          delete-branch: true

      - name: Report Pull Request Status
        if: always()
        run: |
          PR_URL="${{ steps.cpr.outputs.pull-request-url }}"
          BRANCH="automated/panic-corpus-${{ github.run_id }}"
          if [ -n "$PR_URL" ]; then
            echo "### Pull Request Created: [$PR_URL]($PR_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### New panic corpus pushed to branch: \`$BRANCH\`" >> $GITHUB_STEP_SUMMARY
            echo "[Click here to review and open the Pull Request on GitHub](https://github.com/${{ github.repository }}/pull/new/$BRANCH)" >> $GITHUB_STEP_SUMMARY
          fi
